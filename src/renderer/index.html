<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:"
    />
    <title>Feuillet</title>
    <link rel="icon" href="./favicon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#4f78ff" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <button data-action="mobile-menu" class="icon-btn mobile-only" title="Menu" aria-label="Menu" data-icon="menu"></button>
        <button data-action="toggle-sidebar" class="icon-btn" title="Pages, sommaire et calques (F9)" aria-label="Panneau latéral" data-icon="sidebar"></button>
        <span class="brand"><img src="./favicon.png" alt="" />Feuillet</span>
        <nav class="menubar" id="menubar" aria-label="Menus"></nav>
        <span class="sep"></span>
        <button data-action="undo" title="Annuler (Ctrl+Z)" aria-label="Annuler" data-icon="undo" class="icon-btn"></button>
        <button data-action="redo" title="Rétablir (Ctrl+Maj+Z / Ctrl+Y)" aria-label="Rétablir" data-icon="redo" class="icon-btn"></button>
        <span class="sep"></span>
        <button data-action="add-page" class="desktop-only" title="Ajouter une page après la page actuelle" data-icon="add" data-label="Page"></button>
        <span class="spacer"></span>
        <span class="page-nav" title="Aller à la page (Ctrl+G)">
          Page <input id="page-input" type="number" min="1" value="1" aria-label="Numéro de page" /> / <span id="page-count">1</span>
        </span>
        <button data-action="find" class="icon-btn" title="Rechercher (Ctrl+F)" aria-label="Rechercher" data-icon="find"></button>
        <span id="pointer-info" class="muted"></span>
        <button data-action="toggle-props" class="mobile-only" title="Propriétés" aria-label="Propriétés" data-icon="props"></button>
        <button data-action="zoom-out" title="Zoom arrière" aria-label="Zoom arrière" data-icon="zoom-out" class="icon-btn"></button>
        <button data-action="zoom-fit" id="zoom-label" class="zoom-label" title="Ajuster à la page (Ctrl+0)">100 %</button>
        <button data-action="zoom-in" title="Zoom avant" aria-label="Zoom avant" data-icon="zoom-in" class="icon-btn"></button>
      </header>
      <aside class="sidebar" id="sidebar" aria-label="Pages, sommaire et calques"></aside>
      <aside class="toolbar" id="toolbar" aria-label="Outils">
        <!-- Rangés par usage : les outils de tous les jours d'abord, puis insertion, PDF, navigation. -->
        <button data-tool="select" title="Sélection (V) — clic : choisir un objet, glisser : le déplacer" aria-label="Sélection" data-icon="select" data-label="Sélection"></button>
        <button data-tool="pen" title="Stylo (P) — Maj : ligne droite" aria-label="Stylo" data-icon="pen" data-label="Stylo"></button>
        <button data-tool="highlighter" title="Surligneur (S)" aria-label="Surligneur" data-icon="highlighter" data-label="Surligneur"></button>
        <button data-tool="eraser" title="Gomme (E)" aria-label="Gomme" data-icon="eraser" data-label="Gomme"></button>
        <span class="tool-sep"></span>
        <button data-tool="text" title="Texte (T) — cliquez sur la page pour écrire" aria-label="Texte" data-icon="text" data-label="Texte"></button>
        <button data-tool="shape" title="Formes (R) — ligne, flèche, rectangle, ellipse…" aria-label="Formes" data-icon="shape" data-label="Formes"></button>
        <button data-action="insert-image" title="Image — insérer une image ou une photo" aria-label="Image" data-icon="image" data-label="Image"></button>
        <button data-tool="table" title="Tableau — cliquez sur la page pour le placer" aria-label="Tableau" data-icon="table" data-label="Tableau"></button>
        <button data-action="chart" title="Graphique — barres, courbes, secteurs…" aria-label="Graphique" data-icon="chart" data-label="Graphique"></button>
        <span class="tool-caption" aria-hidden="true">PDF</span>
        <button data-tool="textselect" title="Annoter PDF (X) — sélectionner le texte d'un PDF importé pour le copier, le surligner, le souligner ou le barrer" aria-label="Annoter PDF" data-icon="textselect" data-label="Annoter PDF"></button>
        <button data-tool="edittext" title="Modifier PDF (M) — cliquer sur un paragraphe d'un PDF importé pour le réécrire (ou double-clic dessus)" aria-label="Modifier PDF" data-icon="edittext" data-label="Modifier PDF"></button>
        <span class="tool-sep"></span>
        <button data-tool="lasso" title="Lasso (L) — entourer à main levée pour sélectionner plusieurs objets" aria-label="Lasso" data-icon="lasso" data-label="Lasso"></button>
        <button data-tool="hand" title="Main (H, ou maintenir Espace) — déplacer la vue" aria-label="Main" data-icon="hand" data-label="Main"></button>
      </aside>
      <main class="workspace" id="workspace">
        <canvas id="stage"></canvas>
        <div class="selection-bar" id="selection-bar" hidden>
          <button data-action="copy" title="Copier (Ctrl+C)" data-icon="copy" data-label="Copier"></button>
          <button data-action="cut" title="Couper (Ctrl+X)" data-icon="cut" data-label="Couper"></button>
          <button data-action="paste" title="Coller (Ctrl+V)" data-icon="paste" data-label="Coller"></button>
          <button data-action="duplicate" title="Dupliquer (Ctrl+D)" data-icon="duplicate" data-label="Dupliquer"></button>
          <span class="sep"></span>
          <button data-action="group" title="Grouper (Ctrl+G)" data-icon="group" data-label="Grouper"></button>
          <button data-action="ungroup" title="Dégrouper (Ctrl+Maj+G)" data-icon="ungroup" data-label="Dégrouper"></button>
          <button data-action="front" title="Premier plan (Ctrl+Maj+])" data-icon="front" data-label="Devant"></button>
          <button data-action="back" title="Arrière-plan (Ctrl+Maj+[)" data-icon="back" data-label="Derrière"></button>
          <button data-action="ink-to-text" title="Convertir en texte — l'écriture sélectionnée devient du texte" data-icon="text" data-label="En texte" hidden></button>
          <button data-action="crop" title="Rogner — ne garder qu'une partie de l'image ou de la page PDF" data-icon="crop" data-label="Rogner" hidden></button>
          <span class="sep"></span>
          <button data-action="delete" class="danger" title="Supprimer (Suppr)" data-icon="delete" data-label="Supprimer"></button>
        </div>
        <div class="drop-overlay" id="drop-overlay" hidden>Déposez vos fichiers ici</div>
      </main>
      <aside class="properties" id="properties" aria-label="Propriétés"></aside>
      <footer class="statusbar">
        <span id="tool-hint" class="tool-hint"></span>
        <span class="spacer"></span>
        <span class="zoom-hint">Zoom : <kbd id="key-zoom-in"></kbd> / <kbd id="key-zoom-out"></kbd> (sur le pointeur) · Ctrl+molette · Espace = déplacer</span>
      </footer>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <dialog id="shortcuts-dialog" class="dialog">
      <form method="dialog">
        <h2>Raccourcis clavier</h2>
        <div id="shortcuts-list" class="shortcuts-list"></div>
        <menu><button value="ok" class="primary">Fermer</button></menu>
      </form>
    </dialog>
    <dialog id="export-dialog" class="dialog">
      <form method="dialog">
        <h2>Exporter</h2>
        <label>Format
          <select name="format" id="export-format"></select>
        </label>
        <label>Pages
          <select name="pages" id="export-pages">
            <option value="all">Toutes les pages</option>
            <option value="current">Page actuelle</option>
            <option value="range">Plage…</option>
          </select>
        </label>
        <label id="export-range-row" hidden>Plage (ex. 1-3, 5)
          <input name="range" id="export-range" placeholder="1-3, 5" />
        </label>
        <label id="export-dpi-row">Résolution
          <select name="dpi" id="export-dpi">
            <option value="96">96 ppp (écran)</option>
            <option value="150" selected>150 ppp</option>
            <option value="300">300 ppp (impression)</option>
            <option value="600">600 ppp</option>
          </select>
        </label>
        <p class="muted small" id="export-hint"></p>
        <menu>
          <button value="cancel" formnovalidate>Annuler</button>
          <button value="ok" class="primary" id="export-confirm">Exporter</button>
        </menu>
      </form>
    </dialog>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
